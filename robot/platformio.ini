; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = robot_permanent

[env:robot_permanent]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
extra_scripts = post:../scripts/fw_version.py
lib_deps =
	regenbogencode/ESPNowW@^1.0.2
	robotis-git/Dynamixel2Arduino@^0.7.0
	luisllamasbinaburo/I2CScanner@^1.0.1
	spacetrekksc/BQ25887@^0.1.2
	adafruit/Adafruit NeoPixel@^1.12.3
	adafruit/Adafruit INA237 and INA238 Library@^1.0.3
	adafruit/Adafruit MPU6050@^2.2.9

; Battery runtime test (q8botone-docs: docs/tests/battery-runtime) - the boot
; battery cutoff is off, so a run goes all the way down to the PCB's
; undervoltage protection. Not for normal use; reports "+powertest" on 'i'.
[env:robot_power_test]
extends = env:robot_permanent
build_flags = -DQ8_POWER_TEST